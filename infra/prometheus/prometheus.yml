global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fraud-scorer
    static_configs:
      - targets: ["scorer:8000"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
