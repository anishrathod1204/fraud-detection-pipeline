# =============================================================================
# Real-Time Fraud Detection Pipeline - local development stack
# =============================================================================
# Brought up with `make up` (or `./scripts/up.sh`). Services are ordered to
# respect dependencies: Kafka and Cassandra come up first and are gated by
# healthchecks, then their one-shot initialisers, then observability, then the
# application containers.
#
# `version:` is intentionally omitted - it is obsolete in Compose v2+.
# =============================================================================

name: fraud-detection

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Kafka broker - KRaft mode (no ZooKeeper).
  #
  # Three listeners are configured because clients live in two network
  # namespaces:
  #   INTERNAL   kafka:29092     -> other compose services
  #   EXTERNAL   localhost:9092  -> processes on the host (producer, Spark)
  #   CONTROLLER kafka:29093     -> KRaft quorum, broker-internal only
  # Advertising both means a client always receives an address it can resolve.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # external client access
      - "9101:9101"   # JMX, scraped for broker metrics
    environment:
      # --- KRaft identity -----------------------------------------------------
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- Listeners ----------------------------------------------------------
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- Single-node durability settings ------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the kafka-init service so that
      # partition counts are deterministic rather than defaulted.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      # --- Throughput tuning (see docs/architecture.md) -----------------------
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_COMPRESSION_TYPE: producer
      # --- JMX ----------------------------------------------------------------
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Succeeds only once the broker is accepting API requests, which is later
      # than "process started" - downstream services depend on this condition.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # One-shot topic bootstrap. Exits 0 once `transactions`, `fraud-alerts` and
  # the dead-letter topic exist with the configured partition counts, which
  # gates every downstream Kafka client via `service_completed_successfully`.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TRANSACTIONS_TOPIC: ${KAFKA_TRANSACTIONS_TOPIC:-transactions}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-fraud-alerts}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transactions-dlq}
      KAFKA_TRANSACTIONS_PARTITIONS: ${KAFKA_TRANSACTIONS_PARTITIONS:-6}
      KAFKA_ALERTS_PARTITIONS: ${KAFKA_ALERTS_PARTITIONS:-3}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-1}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    volumes:
      - ./infra/kafka/create_topics.sh:/opt/init/create_topics.sh:ro
    entrypoint: ["bash", "/opt/init/create_topics.sh"]
    restart: on-failure
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Cassandra - serving store for scored transactions and fraud alerts.
  #
  # Single node with a small fixed heap: the default sizing heuristic claims a
  # quarter of host RAM, which is wasteful for local development. vnode count is
  # reduced from 256 to 16 purely to shorten startup.
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: fraud-cassandra
    hostname: cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fraud-detection-cluster
      CASSANDRA_DC: ${CASSANDRA_DATACENTER:-datacenter1}
      CASSANDRA_RACK: rack1
      # GossipingPropertyFileSnitch keeps the DC name stable, which the Python
      # driver requires for its DC-aware load-balancing policy.
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # CQL readiness, not just process liveness: the native transport binds
      # several seconds after the JVM starts.
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # One-shot schema initialiser. Creates the keyspace and tables, then verifies
  # they exist before exiting 0 - a silent partial apply would surface much
  # later as a write failure in the streaming job.
  # ---------------------------------------------------------------------------
  cassandra-init:
    image: cassandra:4.1
    container_name: fraud-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fraud_detection}
      CASSANDRA_SCHEMA_FILE: /opt/init/schema.cql
    volumes:
      - ./infra/cassandra/schema.cql:/opt/init/schema.cql:ro
      - ./infra/cassandra/init.sh:/opt/init/init.sh:ro
    entrypoint: ["bash", "/opt/init/init.sh"]
    restart: on-failure
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus - pull-based metric collection.
  #
  # extra_hosts maps host.docker.internal to the bridge gateway so the scrape
  # targets for the host-run producer and Spark job resolve on Linux as well as
  # Docker Desktop.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fraud-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=72h
      - --web.enable-lifecycle          # allows config reload without restart
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana - operational dashboards.
  #
  # Anonymous viewer access is enabled so the dashboard opens straight away for
  # a demo; the admin account still exists for editing. Both are acceptable
  # only because this stack is local-only.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fraud-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "true"
      # Suppress outbound calls - this stack must work fully offline.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted as a single file rather than the whole dashboard/ directory,
      # which also holds the Streamlit app that Grafana must not try to parse.
      - ./dashboard/fraud_dashboard.json:/etc/grafana/dashboards/fraud_dashboard.json:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - fraud-net
    logging: *default-logging

networks:
  fraud-net:
    name: fraud-net
    driver: bridge

volumes:
  kafka-data:
    name: fraud-kafka-data
  cassandra-data:
    name: fraud-cassandra-data
  prometheus-data:
    name: fraud-prometheus-data
  grafana-data:
    name: fraud-grafana-data
