# =============================================================================
# Real-Time Fraud Detection Pipeline - local development stack
# =============================================================================
# Brought up with `make up` (or `./scripts/up.sh`). Services are ordered to
# respect dependencies: Kafka and Cassandra come up first and are gated by
# healthchecks, then their one-shot initialisers, then observability, then the
# application containers.
#
# `version:` is intentionally omitted - it is obsolete in Compose v2+.
# =============================================================================

name: fraud-detection

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Kafka broker - KRaft mode (no ZooKeeper).
  #
  # Three listeners are configured because clients live in two network
  # namespaces:
  #   INTERNAL   kafka:29092     -> other compose services
  #   EXTERNAL   localhost:9092  -> processes on the host (producer, Spark)
  #   CONTROLLER kafka:29093     -> KRaft quorum, broker-internal only
  # Advertising both means a client always receives an address it can resolve.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # external client access
      - "9101:9101"   # JMX, scraped for broker metrics
    environment:
      # --- KRaft identity -----------------------------------------------------
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- Listeners ----------------------------------------------------------
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- Single-node durability settings ------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the kafka-init service so that
      # partition counts are deterministic rather than defaulted.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      # --- Throughput tuning (see docs/architecture.md) -----------------------
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_COMPRESSION_TYPE: producer
      # --- JMX ----------------------------------------------------------------
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Succeeds only once the broker is accepting API requests, which is later
      # than "process started" - downstream services depend on this condition.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - fraud-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # One-shot topic bootstrap. Exits 0 once `transactions`, `fraud-alerts` and
  # the dead-letter topic exist with the configured partition counts, which
  # gates every downstream Kafka client via `service_completed_successfully`.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TRANSACTIONS_TOPIC: ${KAFKA_TRANSACTIONS_TOPIC:-transactions}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-fraud-alerts}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transactions-dlq}
      KAFKA_TRANSACTIONS_PARTITIONS: ${KAFKA_TRANSACTIONS_PARTITIONS:-6}
      KAFKA_ALERTS_PARTITIONS: ${KAFKA_ALERTS_PARTITIONS:-3}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-1}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    volumes:
      - ./infra/kafka/create_topics.sh:/opt/init/create_topics.sh:ro
    entrypoint: ["bash", "/opt/init/create_topics.sh"]
    restart: on-failure
    networks:
      - fraud-net
    logging: *default-logging

networks:
  fraud-net:
    name: fraud-net
    driver: bridge

volumes:
  kafka-data:
    name: fraud-kafka-data
